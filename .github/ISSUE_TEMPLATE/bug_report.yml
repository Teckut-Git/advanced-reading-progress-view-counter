name: Bug Report
description: Report a bug in the plugin
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill out the form below.
  - type: input
    id: version
    attributes:
      label: Plugin Version
      description: Which version of the plugin are you using?
      placeholder: "1.0.3"
    validations:
      required: true
  - type: input
    id: wp-version
    attributes:
      label: WordPress Version
      placeholder: "6.7"
    validations:
      required: true
  - type: input
    id: php-version
    attributes:
      label: PHP Version
      placeholder: "8.2"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe the bug...
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
      placeholder: I expected...
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened.
      placeholder: Instead, this happened...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Error Logs / Console Output
      description: Any relevant error messages, PHP logs, or browser console output.
      render: shell
      placeholder: Paste logs here...
  - type: checkboxes
    id: terms
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues to avoid duplicates
          required: true
        - label: I have tested with all other plugins disabled
          required: false
        - label: I have tested with a default WordPress theme
          required: false
