name: Deploy to WordPress.org

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to deploy (e.g., 1.0.3)'
        required: true
        type: string

jobs:
  deploy:
    name: Deploy to WP.org
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction
        working-directory: ${{ github.workspace }}

      - name: Get version from tag or input
        id: version
        run: |
          if [ "${{ github.event.inputs.version }}" != "" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          fi

      - name: Update plugin version
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          sed -i "s/Version:.*/Version:           $VERSION/" advanced-reading-progress-view-counter.php
          sed -i "s/Stable tag:.*/Stable tag: $VERSION/" readme.txt
          # Update changelog with new version header if not present
          if ! grep -q "= $VERSION =" readme.txt; then
            sed -i "/^== Changelog ==/a\\\\n= $VERSION =\\n* Updated\\n" readme.txt
          fi

      - name: Deploy to WordPress.org SVN
        uses: 10up/action-wordpress-plugin-deploy@stable
        env:
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SLUG: advanced-reading-progress-view-counter
```